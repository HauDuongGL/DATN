name: verify_clone
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  url_launcher: ^6.3.1
  go_router: ^15.1.2
  google_fonts: ^6.2.1
  sqflite: ^2.4.1
  easy_localization: ^3.0.7+1
  freezed_annotation: ^2.4.4
  logger: ^2.6.0
  flutter_riverpod: ^2.6.1
  mapbox_maps_flutter: ^2.10.0
  permission_handler: ^12.0.1
  flutter_dotenv: ^5.2.1
  get_it: ^8.0.3
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  animated_custom_dropdown: ^3.1.1
  dropdown_search: ^5.0.6
  camera: ^0.10.5+9
  path_provider: ^2.1.2
  path: ^1.9.0
  geolocator: ^14.0.2
  uuid: ^4.4.2
  retrofit: ^4.4.1
  flutter_svg: ^2.0.10+1
  exif: ^3.3.0 
  sqflite_common: ^2.5.4+6
  http: ^1.5.0
  connectivity_plus: ^6.1.5
  pretty_dio_logger: ^1.4.0
  fluttertoast: ^8.2.12
  injectable: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  freezed: ^2.5.7
  flutter_lints: ^4.0.0
  retrofit_generator: ">=8.0.0 <10.0.0"
  build_runner: ^2.4.13
  json_serializable: ^6.9.0
  flutter_gen_runner:


dependency_overrides:
  geolocator_android: 4.6.1

global_options:
  freezed:
    runs_before:
      - json_serializable
  json_serializable:
    runs_before:
      - retrofit_generator:retrofit

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/mock/users.json
    - assets/
    - assets/icons/
    - assets/images/
    - assets/translations/
    - assets\images\pending_img.png
