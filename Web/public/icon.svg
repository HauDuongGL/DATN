<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .background { fill: #10b981; }
      .foreground { fill: white; }
      .petal { fill: #ffffff; }
      .center { fill: #fbbf24; }
    }
    @media (prefers-color-scheme: dark) {
      .background { fill: #059669; }
      .foreground { fill: white; }
      .petal { fill: #ffffff; }
      .center { fill: #f59e0b; }
    }
  </style>
  <rect class="background" width="180" height="180" rx="37" />
  <g transform="translate(90, 90)">
    <!-- Flower petals -->
    <circle class="petal" cx="0" cy="-35" r="20" opacity="0.9"/>
    <circle class="petal" cx="30" cy="-10" r="20" opacity="0.9"/>
    <circle class="petal" cx="30" cy="25" r="20" opacity="0.9"/>
    <circle class="petal" cx="0" cy="40" r="20" opacity="0.9"/>
    <circle class="petal" cx="-30" cy="25" r="20" opacity="0.9"/>
    <circle class="petal" cx="-30" cy="-10" r="20" opacity="0.9"/>
    <!-- Flower center -->
    <circle class="center" cx="0" cy="0" r="18"/>
  </g>
</svg>
